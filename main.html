<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expanding Cards</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial, sans-serif;
      background:#f4f4f4;
    }

    .container{
      width:90%;
      display:flex;
      gap:15px;
    }

    .panel{
      height:500px;
      border-radius:50px;
      cursor:pointer;
      color:white;
      position:relative;
      flex:0.5;
      background-size:cover;
      /* background-position:center; */
      /* background-repeat:no-repeat; */

      transition:flex 0.7s ease-in;
      overflow:hidden;
    }

    .panel.active{
      flex:5;
    }

    .img-text{
      position:absolute;
      bottom:20px;
      left:20px;
      font-size:22px;
      font-weight:bold;

      opacity:0;
      transition:opacity 0.4s ease;
    }

    .panel.active .img-text{
      opacity:1;
      transition-delay:0.4s;
    }

    @media(max-width:768px){

      .container{
        width:100%;
      }

      .panel:nth-of-type(4),
      .panel:nth-of-type(5){
        display:none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div 
      class="panel active" 
      id="panel-1"
      style="background-image:url('https://images.unsplash.com/photo-1558979158-65a1eaa08691?auto=format&fit=crop&w=1350&q=80')"
    >
      <h3 class="img-text">Explore the world</h3>
    </div>

    <div 
      class="panel" 
      id="panel-2"
      style="background-image:url('https://images.unsplash.com/photo-1572276596237-5db2c3e16c5d?auto=format&fit=crop&w=1350&q=80')"
    >
      <h3 class="img-text">Wild Forest</h3>
    </div>

    <div 
      class="panel" 
      id="panel-3"
      style="background-image:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1353&q=80')"
    >
      <h3 class="img-text">Sunny Beach</h3>
    </div>

    <div 
      class="panel" 
      id="panel-4"
      style="background-image:url('https://images.unsplash.com/photo-1551009175-8a68da93d5f9?auto=format&fit=crop&w=1351&q=80')"
    >
      <h3 class="img-text">City on Winter</h3>
    </div>

    <div 
      class="panel" 
      id="panel-5"
      style="background-image:url('https://images.unsplash.com/photo-1549880338-65ddcdfd017b?auto=format&fit=crop&w=1350&q=80')"
    >
      <h3 class="img-text">Mountain Cloud</h3>
    </div>

  </div>

  <script>

    // selecting all panels
     const panels = document.querySelectorAll(".panel");

    // loop through every panel
     panels.forEach(function(panel){

      // add click event on every panel
      panel.addEventListener("click", function(){

        // remove active class from all panels
           removeActiveClasses();

        // add active class to clicked panel
        panel.classList.add("active");
           });
        });

    // function to remove active class
    function removeActiveClasses(){

          panels.forEach(function(panel){
             panel.classList.remove("active");
              });

    }

  </script>

</body>
</html>
